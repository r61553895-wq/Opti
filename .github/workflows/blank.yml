name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o maxperf-mod-project.zip -d project
          find project -maxdepth 3 | head -60

      - name: Build jar
        shell: bash
        run: |
          set -o pipefail
          FILE=$(find project -name 'settings.gradle*' | awk -F/ '{print NF, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          [ -z "$FILE" ] && FILE=$(find project -name 'build.gradle*' | awk -F/ '{print NF, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          [ -z "$FILE" ] && { echo "Gradle project not found"; exit 1; }
          cd "$(dirname "$FILE")"
          echo "Project dir: $PWD"; ls -la; java -version
          if [ -f gradlew ]; then chmod +x gradlew; CMD=./gradlew; else CMD=gradle; fi
          $CMD build --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        run: grep -nE "What went wrong|error:|FAILED|Caused by|Could not" -A4 build.log | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-jar
          path: |
            project/**/build/libs/*.jar
            build.log
