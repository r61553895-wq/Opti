name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -o maxperf-mod-project.zip -d project

      - name: Build jar
        run: |
          DIR=$(dirname "$(find project -name settings.gradle* -print -quit)")
          cd "$DIR"
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew build --no-daemon; else gradle build --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: project/**/build/libs/*.jar
